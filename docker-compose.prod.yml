# PRODUCCIÓN. Se aplica EXPLÍCITAMENTE, encadenado con docker-compose.yml
# (make docker-up-prod ya lo hace) — a diferencia de override.yml, esto
# nunca se suma solo. Agrega nginx (SSL + headers + rate limit de borde)
# delante de la app, que acá no expone el puerto 3000 al host directamente.
services:
  # Solo en loopback: "make migration-run-prod" corre en el HOST (necesita
  # ts-node + el código fuente, que la imagen "runtime" no tiene — ver
  # docker/Dockerfile), así que necesita alcanzar Postgres desde ahí. Nunca
  # en 0.0.0.0: la base no se expone a la red, solo a este mismo servidor.
  postgres:
    ports:
      - '127.0.0.1:${DATABASE_PORT:-5432}:5432'

  app:
    build:
      target: runtime
    env_file:
      - .env.prod
    expose:
      - '3000'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    ports:
      # Puerto del HOST configurable (default 80/443) — hace falta en un
      # servidor que ya tiene otro proyecto usando esos puertos. El nginx
      # de ADENTRO del contenedor sigue escuchando 80/443 siempre; esto
      # solo cambia a qué puerto del host se mapean. Ver .env.example.
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    depends_on:
      - app
