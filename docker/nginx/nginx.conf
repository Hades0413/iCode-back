user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # No anunciar la versión de nginx en headers de error/Server.
  server_tokens off;

  log_format main '$remote_addr - [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # Rate limit de borde: defensa en profundidad además del throttler de la
  # app (@nestjs/throttler). Esto frena a nivel de proxy, antes de que la
  # request gastue un worker de Node — 20 req/s por IP con ráfaga de 40.
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  upstream app_upstream {
    server app:3000;
  }

  # HTTP -> HTTPS. Nada de lógica acá aparte de la redirección.
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeceras de seguridad a nivel de borde. La app (Helmet) ya las manda
    # también — esto asegura que sigan presentes incluso en respuestas que
    # nginx genere directamente (errores, límites) y no solo en las que
    # pasan por Node.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;

    client_max_body_size 5m;

    location / {
      limit_req zone=api_limit burst=40 nodelay;

      proxy_pass http://app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sin rate limit propio: para que un healthcheck/monitor frecuente no
    # se autobloquee.
    location = /health {
      proxy_pass http://app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
